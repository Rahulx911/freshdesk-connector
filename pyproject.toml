[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woocommerce-connector"
version = "0.1.0"
description = "Read-only, payment-aware WooCommerce connector (MCP server) for Agent Studio agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.10,<2",
  "pydantic>=2.5",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "fastapi>=0.110", "uvicorn>=0.29",
       "ruff>=0.6", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7", "hypothesis>=6"]
evals = ["anthropic>=0.40"]

[project.scripts]
woocommerce-connector = "woocommerce_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: spawns real servers and uses wall-clock time"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101", "S311", "RUF001", "RUF002", "RUF003", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "ASYNC"]
"mock_server/*" = ["S", "B008"]
"scripts/*" = ["S603", "S607"]
"evals/*" = ["S603", "S607", "E402"]

[tool.mypy]
python_version = "3.10"
packages = ["woocommerce_connector"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["woocommerce_connector"]
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = false
