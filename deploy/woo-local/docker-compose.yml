# A real WooCommerce store on your laptop, so `demo.py --live` runs against
# the genuine REST API with no signup, no trial clock and no credit card.
#
#   cd deploy/woo-local && docker compose up -d && ./bootstrap.sh
#
# The bootstrap prints a Read-scoped consumer key/secret to paste into the
# connector. Nothing here is meant to face the internet.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpw
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # wp-cli shares the WordPress volume and network so bootstrap.sh can drive
  # the site. It exits immediately unless given a command.
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db:
  wp:
